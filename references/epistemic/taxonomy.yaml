# Canonical provenance tag taxonomy
#
# Source of truth for the six base tags: references/AGREEMENT-LOOP.md
# (lines 96-111). AGREEMENT-LOOP.md does not mention subtypes; this file
# is the sole normative source for the base:subtype registry below.
#
# Bare base tags are always valid. Subtype syntax ([base:subtype]) is
# valid only for registered pairs enumerated below.
#
# Three surfaces, three rules — do not conflate:
#   - Work Object evidence ledger rows: bare six only. tools/ws/validate.py
#     rejects subtype tokens here; see _CANONICAL_EVIDENCE_TAGS.
#   - Skill prose: six base tags plus registered base:subtype pairs from
#     this file, enforced by `ws epistemic lint` (tools/ws/epistemic.py).
#   - Claims (tools/ws/claim.py): kind is a structured sidecar field, not
#     a bracket token — {observation, inference, decision}.
#
# schema_version must be bumped on any breaking change to the taxonomy
# structure (adding/removing required fields, changing semantics).

schema_version: 1

base_tags:
  - tag: system
    description: >
      Current code, configuration, executable results, and records.
  - tag: decision
    description: >
      Explicit user or accountable-owner decisions.
  - tag: inference
    description: >
      Agent reasoning and unverified hypotheses.
  - tag: gap
    description: >
      Facts that could not be accessed or established.
  - tag: testimony
    description: >
      Attributable human observations with context and uncertainty.
  - tag: memory
    description: >
      Relevant, user-approved reusable preferences.

subtypes:
  - base: system
    subtype: discovery
    description: >
      Discovery from codebase or artifact inspection (e.g., routes,
      components, design tokens).
  - base: system
    subtype: predecessor
    description: >
      Link to a predecessor Work Object, ADR, or artifact that the
      current object continues, supersedes, or extends.
  - base: system
    subtype: plan
    description: >
      Reference to a documented plan or design artifact (e.g., docs/design/
      or planning document).
