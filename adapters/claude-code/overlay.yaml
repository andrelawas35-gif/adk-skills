# Claude Code Platform Overlay
# This file defines only what differs from the canonical core.
# Core decision logic, authority boundaries, and schema semantics MUST NOT be changed here.

platform: claude-code
platform_label: "Claude Code"
skill_install_dir: "~/.claude/skills/"
project_install_dir: ".claude/skills/"
skill_file_extension: ".md"
manifest_path: "adapters/claude-code/manifest.json"

# Discovery — how the adapter finds the workspace
discovery:
  config_path: ".work-studio/config.md"
  boundary_markers:
    - ".git"
  stop_conditions:
    - "repository root (presence of .git)"
    - "filesystem boundary"

# Capability mappings — abstract capability → platform-native tool or instruction
capability_mappings:
  file_read: "Read"
  file_write: "Write / Edit"
  directory_list: "Bash ls"
  glob_search: "Glob"
  content_search: "Grep"
  terminal_run: "Bash"
  git_operations: "Bash (git commands)"
  web_fetch: "WebFetch / WebSearch"
  web_search: "WebSearch"
  subagent_spawn: "Task"
  background_processes: "Bash (background) / Monitor"
  deployment: "—"
  secret_access: "—"
  persistent_session_state: "—"
  file_uploads: "—"
  artifact_rendering: "Artifact"
  user_confirmation: "conversation turn"

# Capability classifications
capabilities:
  file_read: native
  file_write: native
  directory_list: native
  glob_search: native
  content_search: native
  terminal_run: native
  git_operations: native
  web_fetch: native
  subagent_spawn: native
  structured_output: native
  user_confirmation: native
  browser_automation: manual-fallback
  web_search: manual-fallback
  subagent_isolation: manual-fallback
  parallel_tool_execution: manual-fallback
  deployment: manual-fallback
  secret_access: manual-fallback
  background_processes: native
  persistent_session_state: manual-fallback
  file_uploads: manual-fallback
  artifact_rendering: native

# Declared limitations — these appear in the generated adapter
declared_limitations:
  - capability: subagent_isolation
    classification: manual-fallback
    description: "Claude Code sub-agents (Task tool) have different isolation guarantees than Codex subagents. For sensitive multi-agent workflows, verify isolation boundaries manually."
  - capability: deployment
    classification: manual-fallback
    description: "No platform has first-class deployment tooling. Deployment commands execute through the shell. The skill's authority gate provides the authorization ceremony; the capability layer provides the execution instruction."
  - capability: secret_access
    classification: manual-fallback
    description: "No platform has first-class vault or secret-store access. Credentials are provided by the user or environment. The skill must not invent, infer, or cache credentials."
  - capability: browser_automation
    classification: manual-fallback
    description: "Claude Code browser automation differs from Codex. Complex page interactions may require manual steps."

# Frontmatter overrides — merged into the core frontmatter
frontmatter:
  add:
    platform: claude-code
