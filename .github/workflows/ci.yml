name: CI — Work Studio Conformance Gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Gate 1: Generated-artifact drift ──────────────────────────────
      - name: Fail on committed-adapter drift
        run: |
          python3 tools/generate-adapters.py
          if ! git diff --quiet -- adapters; then
            echo "::error::Generated adapters are out of date. Run 'python3 tools/generate-adapters.py' and commit."
            git --no-pager diff --stat -- adapters
            exit 1
          fi
          echo "Committed adapters match the canonical core."

      # ── Gate 2: Generator + installer test suite ───────────────────────
      - name: Generator + installer test suite
        run: sh tests/run.sh

      # ── Gate 3: Behavioral matrix and structural verification ──────────
      - name: Verify behavioral matrix and adapter structure
        run: python3 tools/verify-conformance.py --all

      # ── Gate 4: Manifest and checksum integrity ────────────────────────
      - name: Verify manifests and SHA256SUMS
        run: |
          for platform in codex claude-code github-copilot; do
            echo "=== $platform ==="
            python3 -c "
import json, hashlib
from pathlib import Path
manifest = json.loads(Path('adapters/$platform/manifest.json').read_text())
for entry in manifest['files']:
    actual = hashlib.sha256(Path(entry['path']).read_bytes()).hexdigest()
    assert actual == entry['sha256'], f'{entry[\"path\"]}: checksum mismatch'
print('Manifest OK')
            "
            sha256sum -c "adapters/$platform/SHA256SUMS" 2>/dev/null || \
              shasum -a 256 -c "adapters/$platform/SHA256SUMS" 2>/dev/null
          done

      # ── Gate 5: Clean checkout demonstration ──────────────────────────
      - name: Verify implemented skills are demonstrable from clean checkout
        run: |
          echo "=== Work Studio Clean Checkout Validation ==="
          errors=0
          for f in references/WORK-OBJECT.md references/AGREEMENT-LOOP.md \
                   references/EVIDENCE-MODEL.md references/CONSEQUENCE-AUTHORITY.md \
                   references/CAPABILITY-DEGRADATION.md; do
            [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
          done
          for f in skills/core/*/SKILL.md; do
            [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
          done
          for platform in codex claude-code github-copilot; do
            for f in adapters/$platform/skills/*/SKILL.md; do
              [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
            done
            for f in "adapters/$platform/manifest.json" "adapters/$platform/SHA256SUMS"; do
              [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
            done
          done
          for f in fixtures/slice-*.md; do
            [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
          done
          [ -f ".work-studio/config.md" ] && echo "  OK: .work-studio/config.md" || { echo "  MISSING: .work-studio/config.md"; errors=1; }
          if [ $errors -ne 0 ]; then
            echo "::error::Work Studio is not demonstrable from clean checkout"
            exit 1
          fi
          echo "=== Work Studio is demonstrable from clean checkout ==="

  # Windows counterpart to the `conformance` job above. Catches regressions
  # that only surface on Windows -- missing `encoding="utf-8"` on file I/O
  # (silently corrupts non-ASCII text via the locale codepage), stdout/stderr
  # encoding crashes, and path-separator bugs (backslash vs forward slash in
  # manifest.json/SHA256SUMS). Gates 1, 3, 4, 5 run via Git Bash (bundled on
  # GitHub's windows-latest runners) since they're already cross-platform;
  # Gate 2 uses PowerShell and tools/install.ps1 specifically, to exercise
  # the native-Windows path a user without Git Bash/WSL would actually take.
  conformance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Gate 1: Generated-artifact drift ──────────────────────────────
      - name: Fail on committed-adapter drift
        shell: bash
        run: |
          python tools/generate-adapters.py
          if ! git diff --quiet -- adapters; then
            echo "::error::Generated adapters are out of date. Run 'python tools/generate-adapters.py' and commit."
            git --no-pager diff --stat -- adapters
            exit 1
          fi
          echo "Committed adapters match the canonical core."

      # ── Gate 2: Generator + installer test suite (native PowerShell) ──
      - name: Generator + installer test suite
        shell: pwsh
        run: .\tests\run.ps1

      # ── Gate 3: Behavioral matrix and structural verification ─────────
      - name: Verify behavioral matrix and adapter structure
        shell: bash
        run: python tools/verify-conformance.py --all

      # ── Gate 4: Manifest and checksum integrity ────────────────────────
      # Reuses the Linux job's bash script verbatim (via Git Bash, bundled on
      # windows-latest runners) rather than a parallel PowerShell rewrite --
      # this gate is pure file/hash checking with no OS-specific behavior to
      # exercise, so duplicating it in a second language would only add risk.
      - name: Verify manifests and SHA256SUMS
        shell: bash
        run: |
          for platform in codex claude-code github-copilot; do
            echo "=== $platform ==="
            python -c "
import json, hashlib
from pathlib import Path
manifest = json.loads(Path('adapters/$platform/manifest.json').read_text(encoding='utf-8'))
for entry in manifest['files']:
    actual = hashlib.sha256(Path(entry['path']).read_bytes()).hexdigest()
    assert actual == entry['sha256'], f'{entry[\"path\"]}: checksum mismatch'
print('Manifest OK')
            "
            sha256sum -c "adapters/$platform/SHA256SUMS" 2>/dev/null || \
              shasum -a 256 -c "adapters/$platform/SHA256SUMS" 2>/dev/null
          done

      # ── Gate 5: Clean checkout demonstration ──────────────────────────
      - name: Verify implemented skills are demonstrable from clean checkout
        shell: bash
        run: |
          echo "=== Work Studio Clean Checkout Validation ==="
          errors=0
          for f in references/WORK-OBJECT.md references/AGREEMENT-LOOP.md \
                   references/EVIDENCE-MODEL.md references/CONSEQUENCE-AUTHORITY.md \
                   references/CAPABILITY-DEGRADATION.md; do
            [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
          done
          for f in skills/core/*/SKILL.md; do
            [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
          done
          for platform in codex claude-code github-copilot; do
            for f in adapters/$platform/skills/*/SKILL.md; do
              [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
            done
            for f in "adapters/$platform/manifest.json" "adapters/$platform/SHA256SUMS"; do
              [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
            done
          done
          for f in fixtures/slice-*.md; do
            [ -f "$f" ] && echo "  OK: $f" || { echo "  MISSING: $f"; errors=1; }
          done
          [ -f ".work-studio/config.md" ] && echo "  OK: .work-studio/config.md" || { echo "  MISSING: .work-studio/config.md"; errors=1; }
          if [ $errors -ne 0 ]; then
            echo "::error::Work Studio is not demonstrable from clean checkout"
            exit 1
          fi
          echo "=== Work Studio is demonstrable from clean checkout ==="
