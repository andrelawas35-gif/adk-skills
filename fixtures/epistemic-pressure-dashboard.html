<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unresolved material conflicts</title>
    <link rel="stylesheet" href="epistemic-pressure-dashboard.tokens.css">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space-3);
        color: var(--color-text);
        background: var(--color-canvas);
        font-family: var(--font-sans);
      }
      .signal {
        width: min(100%, 28rem);
        padding: var(--space-3);
        border: 1px solid var(--color-border);
        border-top: 0.25rem solid var(--color-attention);
        border-radius: var(--radius-card);
        background: var(--color-surface);
      }
      .kind, .note { color: var(--color-muted); }
      .kind {
        margin: 0 0 var(--space-1);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: 1.25rem; }
      .count {
        display: flex;
        align-items: baseline;
        gap: var(--space-1);
        margin: var(--space-3) 0 var(--space-2);
      }
      output {
        color: var(--color-attention);
        font-size: 3rem;
        font-weight: 650;
        line-height: 1;
      }
      .note { margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="signal" aria-labelledby="signal-title">
      <p class="kind">Attention cue</p>
      <h1 id="signal-title">Unresolved material conflicts</h1>
      <div class="count">
        <output data-signal="unresolved-material-conflicts">1</output>
        <span>item to inspect</span>
      </div>
      <p class="note">Review the conflicting sources when this work becomes relevant.</p>
    </main>
  </body>
</html>
