# Do not hand-edit. Prose contracts stay authoritative.

schema_version: 1

skills:
  - name: design-apply-design-direction
    responsibility: "Use when natural-language design direction needs interpretation and execution; proposes concrete changes, executes only after user confirmation, and does not modify code beyond confirmed scope."
    non_goals:
      - "Execute changes without user confirmation."
      - "Modify code beyond the confirmed scope."
      - "Execute Claude Design operations without explicit human confirmation."
      - "Claim the interpretation matches intent without confirmation."
      - "Produce authored specifications — structure emerges from conversation."
      - "Invent changes not grounded in current project state."
    requires_capabilities:
      - file_read
      - file_write
      - content_search
      - structured_output
      - user_confirmation
      - claude_design

  - name: design-audit-product-interface
    responsibility: "Use when a target project's interface structure needs discovery; inspects codebase for routes, components, layouts, and framework conventions; does not modify any project files."
    non_goals:
      - "It does not modify any host-project files, configuration, or code."
      - "Discover design tokens (that is `build-design-foundation`'s domain)."
      - "Produce durable artifacts — the discovery snapshot is ephemeral."
      - "Require any host-project manifest or configuration (DEC-2: zero onboarding)."
      - "Implement, design, or render anything."
    requires_capabilities:
      - file_read
      - directory_list
      - glob_search
      - content_search
      - structured_output

  - name: design-build-design-foundation
    responsibility: "Use when a target project's design tokens need discovery and audit; inspects codebase for typography, spacing, colors, and themes; does not modify any project files."
    non_goals:
      - "It does not modify any host-project files, configuration, or tokens."
      - "Discover routes, components, or layouts (that is `audit-product-interface`)."
      - "Create or recommend new tokens — it reports what exists."
      - "Sync tokens to external design tools."
      - "Produce durable artifacts — the token inventory is ephemeral."
    requires_capabilities:
      - file_read
      - directory_list
      - glob_search
      - content_search
      - structured_output

  - name: design-design-tracer-bullet
    responsibility: "Use when an accepted direction needs the smallest end-to-end experiment; returns a bounded, observable, reversible tracer design; does not implement it or authorize production effects."
    non_goals:
      - "Implement, test, deploy, or operate the tracer bullet."
      - "Create production architecture, a generalized framework, or a roadmap."
      - "Invent evidence, change a confirmed decision, or replace human authority."
      - "Persist an unaccepted recommendation as a design decision."
    requires_capabilities:
      - file_read
      - file_write
      - content_search
      - structured_output
      - user_confirmation

  - name: design-track-components
    responsibility: "Use when durable components must be registered, swept, grilled, cascaded, or retired; returns ledger and inbox mutation proposals; never turns findings into Work Objects or commitments automatically."
    non_goals:
      - "Copy a component's implementation into the ledger, infer dependency edges, invent criteria, or claim a component is settled without a completed pass."
      - "Schedule or autonomously run sweeps, edit the component under review, create a Work Object from a finding, or mass-spawn Work Objects."
      - "Alter `references/AGREEMENT-LOOP.md`, scorecard rules, another skill's Grilling Profile, or the Workspace Documentation Contract without the separately required authority."
    requires_capabilities:
      - file_read
      - content_search
      - file_write
      - terminal_run
      - user_confirmation
      - structured_output

  - name: design-verify-design-implementation
    responsibility: "Use when design implementation needs verification; checks that the agent's code changes match what the user confirmed — browser rendering matches the confirmed proposal; does not fix issues, only reports them."
    non_goals:
      - "Fix implementation issues — it reports them."
      - "Check behavioral correctness (interactions, state transitions, API calls)."
      - "Check full-stack correctness (backend rendering, data loading, auth flows)."
      - "Check accessibility (WCAG compliance, screen reader behavior, keyboard nav)."
      - "Modify any code or design artifacts."
    requires_capabilities:
      - file_read
      - structured_output
      - browser_automation

