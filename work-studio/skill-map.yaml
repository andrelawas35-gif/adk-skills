      - "Create, resume, transition, or annotate a Work Object"
      - "Use `active.md` as a ranking input (drift is reported, not relied on)"
      - "Surface a candidate from `verify` or `observe`"
      - "Score, grade, or rank anything numerically; assign any aggregate health figure; or produce time-series metrics"
      - "Decide that work is finished, or repair `active.md` (repair belongs to the conductor)"
      - "Read bodies, apply model judgment about relative importance, or parse dependency/blocking prose"
    requires_capabilities:
      - file_read
      - directory_list
      - content_search
      - structured_output
      - user_confirmation

  - name: thinking-turn-signal-into-work
    responsibility: "Use when an idea, request, or observation needs classification; preserves provenance and routes it to capture, retention, activation, or discard; does not create durable work without activation authority."
    non_goals:
      - "Implement, investigate, design, deploy, export, or write personal memory."
      - "Treat chat history as durable evidence or personalization."
      - "Scan, read, or mutate a personal archive Work Studio does not own."
      - "Infer activation from enthusiasm, urgency, or a detailed idea."
    requires_capabilities:
      - file_read
      - file_write
      - directory_list
      - content_search
      - structured_output
      - user_confirmation

