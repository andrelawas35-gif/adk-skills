[project]
name = "work-studio-runtime"
version = "0.1.0"
description = "Work Studio local runtime contract layer (Phase 2, WO 2026-08-15-006): strict Pydantic envelope + JSON Schema snapshots for Work Object frontmatter. Isolated Python 3.11 environment; tools/ws stays dependency-free stdlib."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "networkx>=3.0",
    "pydantic>=2.0",
    "pywebview>=6.2.1",
]

[dependency-groups]
test = [
    "hypothesis>=6.100.0",
    "mcp>=2.0.0",
]
# Editable sub-packages that make up the working install. Declaring them here
# (as workspace members, below) lets `uv sync` reproduce the `ws` CLI and the
# MCP server instead of relying on out-of-band `uv pip install -e` calls.
dev = [
    "work-studio-ws",
    "work-studio-mcp",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools", "mcp_server"]

[tool.uv.sources]
work-studio-ws = { workspace = true }
work-studio-mcp = { workspace = true }
